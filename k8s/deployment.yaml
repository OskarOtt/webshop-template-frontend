apiVersion: apps/v1
kind: Deployment
metadata:
  name: webshop-frontend
  labels:
    app: webshop-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webshop-frontend
  template:
    metadata:
      labels:
        app: webshop-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: webshop-frontend
          # Image published by .github/workflows/deploy.yml on push to main
          image: ghcr.io/oskarott/webshop-template-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
